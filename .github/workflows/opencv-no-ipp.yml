name: OpenCV without IPP (Windows candidates)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build both environments or retry one failed candidate
        type: choice
        default: both
        options: [both, core, formula]

permissions:
  contents: read

concurrency:
  group: opencv-no-ipp-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: ${{ fromJSON(inputs.variant == 'both' && '["core","formula"]' || format('["{0}"]', inputs.variant)) }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build-only tools
        run: |
          python -m pip install setuptools==69.5.1 wheel==0.45.1 scikit-build==0.18.1 cmake==3.31.6 numpy==2.0.2 packaging==26.3
          if ($LASTEXITCODE) { throw 'Build tools install failed' }
          python -m unittest discover -s packaging/tests -v
          if ($LASTEXITCODE) { throw 'Packaging tests failed' }
      - name: Build locked source without IPP or FFmpeg
        run: python packaging/build_opencv_no_ipp.py --variant ${{ matrix.variant }} --output candidate
      - name: Verify the actual installed wheel
        run: |
          $wheel = @(Get-ChildItem candidate/wheels/*.whl)
          if ($wheel.Count -ne 1) { throw 'Expected exactly one wheel' }
          python -m pip install --no-deps $wheel[0].FullName
          if ($LASTEXITCODE) { throw 'Candidate installation failed' }
          python packaging/verify_opencv_no_ipp.py --output candidate
          if ($LASTEXITCODE) { throw 'Candidate verification failed' }
      - name: Core OCR and export regression
        if: matrix.variant == 'core'
        run: |
          $packages = Get-Content backend/requirements-lock.txt | Where-Object { $_ -and -not $_.StartsWith('#') -and -not $_.StartsWith('opencv-python==') }
          python -m pip install @packages pytest==9.1.1 httpx==0.28.1 reportlab==5.0.1
          if ($LASTEXITCODE) { throw 'Test dependency install failed' }
          python packaging/verify_opencv_no_ipp.py --output candidate
          if ($LASTEXITCODE) { throw 'Dependency install replaced the candidate' }
          python -m pytest backend/tests -q -o pythonpath=backend --junitxml=candidate/backend-tests.xml
          if ($LASTEXITCODE) { throw 'Backend regression failed' }
          python -c "from rapidocr_onnxruntime import RapidOCR; import json; from pathlib import Path; result,_=RapidOCR()('web/public/examples/notice.png'); assert result and len(result)>2; Path('candidate/ocr-smoke.json').write_text(json.dumps({'blocks':len(result),'texts':[r[1] for r in result]},ensure_ascii=False),encoding='utf-8')"
          if ($LASTEXITCODE) { throw 'Real local OCR failed' }
      - name: Preserve failure diagnostics (no unverified wheel)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencv-${{ matrix.variant }}-failure
          path: |
            candidate/*.log
            candidate/*.json
            candidate/*.txt
            candidate/*.xml
            candidate/*.patch
            candidate/cmake-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Save verified candidate and corresponding source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opencv-${{ matrix.variant }}-no-ipp-windows-x64
          path: |
            candidate/wheels/
            candidate/*.tar.gz
            candidate/*.json
            candidate/*.txt
            candidate/*.log
            candidate/*.xml
            candidate/*.patch
            candidate/cmake-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
